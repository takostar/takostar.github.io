<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anki Clipboard Helper</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #0f766e;
      --border: #d1d5db;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --card: #1f2937;
        --text: #f9fafb;
        --muted: #9ca3af;
        --accent: #34d399;
        --border: #374151;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font: 16px/1.6 Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .card {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    p {
      margin: 8px 0;
    }

    .status {
      margin: 12px 0 16px;
      color: var(--accent);
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 300px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      resize: vertical;
      font: 15px/1.6 Consolas, "Courier New", monospace;
    }

    .actions {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    .hint {
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .preview {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .preview code {
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>复制提示词</h1>
    <p id="status" class="status">正在准备内容...</p>
    <textarea id="payload" readonly></textarea>
    <div class="actions">
      <button type="button" id="copy-btn">再次复制</button>
      <button type="button" id="select-btn">选中文本</button>
    </div>
    <div class="hint">
      建议通过 `https://` 部署此页面；这样浏览器更容易允许自动写入剪切板。若自动复制失败，下面文本框可手动复制。
    </div>
    <div class="preview">
      <p>收到的参数：</p>
      <p><strong>Source:</strong> <code id="source-preview"></code></p>
      <p><strong>Front:</strong> <code id="front-preview"></code></p>
      <p><strong>Text:</strong> <code id="text-preview"></code></p>
    </div>
  </div>

  <script>
    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name) || "";
    }

    function buildMessage(front, text) {
      return `我正在复习基于来源材料制作的抽认卡，并想深入了解其中一张卡片。

这张卡片的正面显示：“${front}”
背面的答案显示：“${text}”


请详细讲讲这个主题。`;
    }

    async function copyText(message) {
      if (!navigator.clipboard || !navigator.clipboard.writeText) {
        throw new Error("clipboard-unavailable");
      }
      await navigator.clipboard.writeText(message);
    }

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    async function handleCopy() {
      try {
        await copyText(payload.value);
        setStatus("已自动复制到剪切板。");
      } catch (error) {
        setStatus("自动复制失败，请手动复制下面文本。");
      }
    }

    var source = getParam("source");
    var front = getParam("front");
    var text = getParam("text");
    var payload = document.getElementById("payload");

    payload.value = buildMessage(front, text);
    document.getElementById("source-preview").textContent = source;
    document.getElementById("front-preview").textContent = front;
    document.getElementById("text-preview").textContent = text;

    document.getElementById("copy-btn").addEventListener("click", handleCopy);
    document.getElementById("select-btn").addEventListener("click", function () {
      payload.focus();
      payload.select();
      setStatus("文本已选中，可直接复制。");
    });

    handleCopy();
  </script>
</body>
</html>
